<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Bexar Maps</title>
  <script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    body { margin: 0; font-family: -apple-system, Segoe UI, Roboto, sans-serif; }
    #map { height: 100vh; }

    #panels {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 260px;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .panel {
      background: rgba(255,255,255,0.95);
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
      overflow: hidden;
    }

    .panel-header {
      padding: 10px 12px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f3f3f3;
      user-select: none;
    }

    .panel-body {
      padding: 8px 12px 12px;
      font-size: 13px;
    }

    .panel-body.collapsed { display: none; }

    .layer-row {
      margin-bottom: 10px;
    }

    .layer-row:last-child { margin-bottom: 0; }

    .layer-row label {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }

    .layer-row input[type="range"] {
      width: 100%;
    }

    .basemap-row label {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }
  </style>
</head>
<body>
<div id="map"></div>

<div id="panels">
  <div class="panel" data-panel="basemaps">
    <div class="panel-header">Basemaps <span class="chevron">▾</span></div>
    <div class="panel-body">
      <div id="basemap-list"></div>
      <div id="road-toggle-row" style="margin-top:8px; padding-top:8px; border-top:1px solid #ddd;"></div>
    </div>
  </div>

  <div class="panel" data-panel="orthomosaics">
    <div class="panel-header">Orthomosaics <span class="chevron">▾</span></div>
    <div class="panel-body" id="ortho-list"></div>
  </div>

  <div class="panel" data-panel="georeferenced">
    <div class="panel-header">Georeferenced Images <span class="chevron">▾</span></div>
    <div class="panel-body" id="georef-list"></div>
  </div>
</div>

<script>
  // ---- CONFIG: edit these arrays to add/remove layers ----

  const BASEMAPS = [
    {
      id: 'osm',
      name: 'OpenStreetMap',
      tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
      tileSize: 256,
      attribution: '© OpenStreetMap contributors'
    },
    {
      id: 'pictometry-2025',
      name: 'Aerial 2025 (Pictometry)',
      tiles: ['https://svc.pictometry.com/Image/880F0C48-8610-0234-E927-2FD8CF8DDC5A/wmts/PICT-TXCSAN25-xbkfA5zP90/default/GoogleMapsCompatible/{z}/{x}/{y}.png'],
      tileSize: 256
      // no scheme needed — GoogleMapsCompatible is standard XYZ, not TMS
    }
    // Add more basemaps here later, e.g. a custom hosted basemap.
    // {
    //   id: 'my-basemap',
    //   name: 'My Custom Basemap',
    //   tiles: ['https://tiles.bexarmaps.com/basemap/{z}/{x}/{y}.png'],
    //   tileSize: 256,
    //   scheme: 'tms'
    // }
  ];

  // Roads overlay — toggles independently on top of whichever basemap is active.
  // Vector tiles (OpenFreeMap, free/no-key, OpenMapTiles schema) instead of a pre-rendered
  // raster service — this gives full control over line weight/color and label styling
  // so it reads as a clean custom overlay rather than someone else's map skin.
  const ROAD_OVERLAY = {
    name: 'Roads',
    defaultOn: false,
    sourceId: 'road-overlay-src',
    vectorUrl: 'https://tiles.openfreemap.org/planet',
    // Layer ids added to the map — kept in one place so the toggle can flip all of them at once.
    layerIds: ['road-overlay-casing', 'road-overlay-line', 'road-overlay-label']
  };

  const ORTHOMOSAICS = [
    {
      id: 'vcbi-1969',
      name: '1969 Aerial (VCBI0)',
      tiles: ['https://tiles.bexarmaps.com/vcbi-1969/{z}/{x}/{y}.png'],
      tileSize: 256,
      scheme: 'tms',
      defaultOpacity: 1,
      defaultOn: false
    }
    // Add 1986 and 1938 sets here later, same structure.
  ];

  const GEOREFERENCED_IMAGES = [
    {
      id: 'belmont-plat-1913',
      name: '1913 Belmont Place Plat',
      tiles: ['https://tiles.bexarmaps.com/plat-test/{z}/{x}/{y}.png'],
      tileSize: 256,
      scheme: 'tms',
      defaultOpacity: 0.85,
      defaultOn: true
    }
  ];

  // ---- END CONFIG ----

  const style = {
    version: 8,
    // Required for the road label text layer below (vector tiles need a glyph source for text rendering).
    glyphs: 'https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf',
    sources: {},
    layers: []
  };

  BASEMAPS.forEach((b, i) => {
    style.sources[b.id] = {
      type: 'raster',
      tiles: b.tiles,
      tileSize: b.tileSize || 256,
      ...(b.scheme ? { scheme: b.scheme } : {})
    };
    style.layers.push({
      id: b.id,
      type: 'raster',
      source: b.id,
      layout: { visibility: i === 0 ? 'visible' : 'none' }
    });
  });

  ORTHOMOSAICS.forEach(o => {
    style.sources[o.id] = {
      type: 'raster',
      tiles: o.tiles,
      tileSize: o.tileSize || 256,
      ...(o.scheme ? { scheme: o.scheme } : {})
    };
    style.layers.push({
      id: o.id,
      type: 'raster',
      source: o.id,
      layout: { visibility: o.defaultOn ? 'visible' : 'none' },
      paint: { 'raster-opacity': o.defaultOpacity ?? 1 }
    });
  });

  GEOREFERENCED_IMAGES.forEach(g => {
    style.sources[g.id] = {
      type: 'raster',
      tiles: g.tiles,
      tileSize: g.tileSize || 256,
      ...(g.scheme ? { scheme: g.scheme } : {})
    };
    style.layers.push({
      id: g.id,
      type: 'raster',
      source: g.id,
      layout: { visibility: g.defaultOn ? 'visible' : 'none' },
      paint: { 'raster-opacity': g.defaultOpacity ?? 1 }
    });
  });

  // Road overlay — added last so it always draws on top of orthomosaics and
  // georeferenced images, regardless of layer order above.
  // Filtered to real roads (motorway/trunk/primary/secondary/tertiary/minor) — hides
  // footpaths/service roads/rail so it stays clean rather than cluttered at wider zooms.
  style.sources[ROAD_OVERLAY.sourceId] = {
    type: 'vector',
    url: ROAD_OVERLAY.vectorUrl
  };

  const ROAD_CLASS_FILTER = ['match', ['get', 'class'],
    ['motorway', 'trunk', 'primary', 'secondary', 'tertiary', 'minor'], true,
    false
  ];

  // Dark, semi-transparent casing under the line for contrast against light/busy imagery.
  style.layers.push({
    id: 'road-overlay-casing',
    type: 'line',
    source: ROAD_OVERLAY.sourceId,
    'source-layer': 'transportation',
    filter: ROAD_CLASS_FILTER,
    layout: {
      'line-cap': 'round',
      'line-join': 'round',
      visibility: ROAD_OVERLAY.defaultOn ? 'visible' : 'none'
    },
    paint: {
      'line-color': '#1a1a1a',
      'line-opacity': 0.15,
      'line-width': ['interpolate', ['linear'], ['zoom'], 10, 1, 14, 2.5, 18, 5.5]
    }
  });

  // Thin white line on top of the casing — subtle at a glance, clear enough to trace at zoom.
  style.layers.push({
    id: 'road-overlay-line',
    type: 'line',
    source: ROAD_OVERLAY.sourceId,
    'source-layer': 'transportation',
    filter: ROAD_CLASS_FILTER,
    layout: {
      'line-cap': 'round',
      'line-join': 'round',
      visibility: ROAD_OVERLAY.defaultOn ? 'visible' : 'none'
    },
    paint: {
      'line-color': '#ffffff',
      'line-opacity': 0.3,
      'line-width': ['interpolate', ['linear'], ['zoom'], 10, 0.5, 14, 1.5, 18, 4]
    }
  });

  // Small, clean labels with a dark halo for legibility — only shows at zooms where it's useful.
  style.layers.push({
    id: 'road-overlay-label',
    type: 'symbol',
    source: ROAD_OVERLAY.sourceId,
    'source-layer': 'transportation_name',
    filter: ROAD_CLASS_FILTER,
    minzoom: 12,
    layout: {
      visibility: ROAD_OVERLAY.defaultOn ? 'visible' : 'none',
      'symbol-placement': 'line',
      'text-field': ['get', 'name'],
      'text-font': ['Noto Sans Regular'],
      'text-size': ['interpolate', ['linear'], ['zoom'], 12, 10, 16, 13],
      'text-letter-spacing': 0.02
    },
    paint: {
      'text-color': '#ffffff',
      'text-halo-color': '#000000',
      'text-halo-width': 1.2
    }
  });

  const map = new maplibregl.Map({
    container: 'map',
    style: style,
    center: [-98.4949279, 29.4178686],
    zoom: 15
  });

  map.addControl(new maplibregl.NavigationControl(), 'top-left');

  // ---- Build Basemaps panel (radio behavior: only one visible at a time) ----
  const basemapList = document.getElementById('basemap-list');
  BASEMAPS.forEach((b, i) => {
    const row = document.createElement('div');
    row.className = 'basemap-row';
    row.innerHTML = `
      <label>
        <input type="radio" name="basemap" value="${b.id}" ${i === 0 ? 'checked' : ''}>
        ${b.name}
      </label>
    `;
    basemapList.appendChild(row);
  });
  basemapList.addEventListener('change', (e) => {
    if (e.target.name !== 'basemap') return;
    BASEMAPS.forEach(b => {
      map.setLayoutProperty(b.id, 'visibility', b.id === e.target.value ? 'visible' : 'none');
    });
  });

  // ---- Build Roads toggle (independent checkbox, not part of the basemap radio group) ----
  const roadToggleRow = document.getElementById('road-toggle-row');
  roadToggleRow.innerHTML = `
    <label style="display:flex;align-items:center;gap:6px;">
      <input type="checkbox" id="road-overlay-toggle" ${ROAD_OVERLAY.defaultOn ? 'checked' : ''}>
      ${ROAD_OVERLAY.name}
    </label>
  `;
  document.getElementById('road-overlay-toggle').addEventListener('change', (e) => {
    const visibility = e.target.checked ? 'visible' : 'none';
    ROAD_OVERLAY.layerIds.forEach(id => {
      if (map.getLayer(id)) {
        map.setLayoutProperty(id, 'visibility', visibility);
      }
    });
  });

  // ---- Build a toggle+opacity layer list (used for both Orthomosaics and Georeferenced Images) ----
  function buildLayerList(containerId, layers) {
    const container = document.getElementById(containerId);
    if (layers.length === 0) {
      container.innerHTML = '<div style="color:#888;">None yet</div>';
      return;
    }
    layers.forEach(l => {
      const row = document.createElement('div');
      row.className = 'layer-row';
      row.innerHTML = `
        <label>
          <input type="checkbox" data-layer="${l.id}" ${l.defaultOn ? 'checked' : ''}>
          ${l.name}
        </label>
        <input type="range" data-opacity="${l.id}" min="0" max="1" step="0.05" value="${l.defaultOpacity ?? 1}">
      `;
      container.appendChild(row);
    });
    container.addEventListener('change', (e) => {
      if (e.target.dataset.layer) {
        map.setLayoutProperty(e.target.dataset.layer, 'visibility', e.target.checked ? 'visible' : 'none');
      }
    });
    container.addEventListener('input', (e) => {
      if (e.target.dataset.opacity) {
        map.setPaintProperty(e.target.dataset.opacity, 'raster-opacity', parseFloat(e.target.value));
      }
    });
  }

  buildLayerList('ortho-list', ORTHOMOSAICS);
  buildLayerList('georef-list', GEOREFERENCED_IMAGES);

  // ---- Collapsible panels ----
  document.querySelectorAll('.panel-header').forEach(header => {
    header.addEventListener('click', () => {
      const body = header.nextElementSibling;
      body.classList.toggle('collapsed');
      const chevron = header.querySelector('.chevron');
      chevron.textContent = body.classList.contains('collapsed') ? '▸' : '▾';
    });
  });
</script>
</body>
</html>
